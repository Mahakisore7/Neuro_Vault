[project]
name = "neurovault-backend"
version = "0.1.0"
description = "NeuroVault API — a personal knowledge graph"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101"]
# N811 fires on `from sqlalchemy.dialects.postgresql import UUID as PgUUID` —
# ruff's naming check treats the ALL-CAPS `UUID` as a "constant" by
# convention and flags the rename. It's a class, not a constant; the alias
# only exists to avoid shadowing Python's own uuid.UUID type.
"app/models/*" = ["N811"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, not one per test: app.db.session.engine
# is a module-level singleton created at import time, and asyncpg connections
# are bound to the loop that opened them. Function-scoped loops (pytest-
# asyncio's default) would hand a test a connection opened on a now-closed
# loop from a previous test and fail with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
addopts = "-q --strict-markers"
