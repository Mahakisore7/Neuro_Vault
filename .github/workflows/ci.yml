name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Postgres 16, not the default 14: the schema relies on the PG15+
      # column-list ON DELETE SET NULL (notebook_id) form (see
      # app/models/note.py) and built-in gen_random_uuid().
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurovault
          POSTGRES_PASSWORD: neurovault
          POSTGRES_DB: neurovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://neurovault:neurovault@localhost:5432/neurovault
      DATABASE_URL_SYNC: postgresql://neurovault:neurovault@localhost:5432/neurovault
      # Not a real project — nothing in CI exercises Supabase-issued JWTs
      # (test_api_smoke.py overrides get_current_user), but Settings
      # requires the field to be present to import at all.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      ENVIRONMENT: test
      DEBUG: "true"
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Stub Supabase-platform schemas (auth, storage)
        run: psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -f ci/bootstrap_supabase_stubs.sql

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time only — a real app never ships these into CI. Nothing in
      # the build calls Supabase or the API over the network; both clients
      # are only ever constructed, not queried, until a page actually runs.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      # Browser tests against the build above, with the API and Supabase
      # mocked in the test (frontend/e2e/mock-backend.ts): signed-in flows,
      # the editor's save behaviour, and an axe accessibility scan per page.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (Playwright + axe)
        run: pnpm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
